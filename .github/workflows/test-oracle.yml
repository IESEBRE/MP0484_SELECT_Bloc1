name: Test Oracle SQL Queries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-sql:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout student repository
      - name: Checkout student repository
        uses: actions/checkout@v4

      # Step 2: Start Oracle XE container
      - name: Start Oracle XE container
        run: |
          docker run --name oracle-db -d -p 1521:1521 -p 5500:5500 \
            -e ORACLE_PASSWORD=oracle \
            -v ${{ github.workspace }}:/workspace \
            gvenzl/oracle-xe:21-slim

      # Step 3: Wait for Oracle to be ready
      - name: Wait for Oracle to be ready
        run: |
          echo "Waiting for Oracle XE to be ready..."
          sleep 25
          for i in {1..30}; do
            if docker exec oracle-db bash -lc "echo 'SELECT 1 FROM dual;' | sqlplus -s system/oracle" | grep -q 1; then
              echo "✅ Oracle is ready."
              break
            fi
            sleep 5
          done

      # Step 4: Clone private solutions repository
      - name: Clone private solutions repository
        run: |
          git clone https://x-access-token:${{ secrets.SOLUTIONS_TOKEN }}@github.com/IESEBRE/MP0484_SOLUCIONS_SQL_2526.git ./MP0484_SOLUCIONS_SQL_2526

      # Step 5: Initialize database schema (optional)
      - name: Run setup SQL if exists
        run: |
          if [ -f ./sql/setup.sql ]; then
            echo "File exists"
            docker cp ./sql/setup.sql oracle-db:/tmp
            docker exec oracle-db bash -lc "sqlplus -s system/oracle @/tmp/setup.sql"
          else
            echo "File does not exist"
          fi

      # 👇 Step 6: Generate expected results from the private repo
      - name: Generate expected results
        run: |
          mkdir -p /workspace/results/expected
          for sql_file in /workspace/MP0484_SOLUCIONS_SQL_2526/SELECT/BLOC1/*.sql; do
            name=$(basename "$sql_file" .sql)
            echo "Generating expected result for $name ..."
            docker exec oracle-db bash -lc "sqlplus system/oracle <<EOF
              SET HEADING OFF 
              SET FEEDBACK OFF 
              SET PAGESIZE 0 
              SET VERIFY OFF 
              SET ECHO OFF
              SPOOL /tmp/${name}_expected.csv
              @$sql_file
              SPOOL OFF
              EXIT;
              EOF"
            
            docker cp oracle-db:/tmp/${name}_expected.csv ./results/expected/
          done

      # 👇 Step 6: Generate student results
      - name: Generate student results
        run: |
          mkdir -p ./results/student
          for sql_file in ./sql/*.sql; do
            name=$(basename "$sql_file" .sql)
            echo "Generating student result for $name ..."
            docker exec oracle-db bash -lc "sqlplus system/oracle <<EOF
              SET HEADING OFF 
              SET FEEDBACK OFF 
              SET PAGESIZE 0 
              SET VERIFY OFF 
              SET ECHO OFF
              SPOOL /tmp/${name}_student.csv
              @$sql_file
              SPOOL OFF
              EXIT;
              EOF"

            docker cp oracle-db:/tmp/${name}_student.csv ./results/student/
          done

      # 👇 Step 7: Compare results
      - name: Compare expected vs student results
        run: |
          echo "Comparing student queries with expected results..."
          pass_count=0
          fail_count=0
          for expected_file in ./results/expected/*.csv; do
            name=$(basename "$expected_file" _expected.csv)
            student_file="./results/student/${name}_student.csv"
            if [ -f "$student_file" ]; then
              if diff -q "$expected_file" "$student_file" > /dev/null; then
                echo "✅ $name: Passed"
                ((pass_count++))
              else
                echo "❌ $name: Failed (results differ)"
                ((fail_count++))
              fi
            else
              echo "⚠️  $name: No student query found"
              ((fail_count++))
            fi
          done
          echo "---------------------------------------------"
          echo "Total passed: $pass_count"
          echo "Total failed: $fail_count"
          if ((fail_count > 0)); then
            exit 1
          fi
