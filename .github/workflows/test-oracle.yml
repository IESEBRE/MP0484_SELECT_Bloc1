name: Test Oracle SQL Queries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-sql:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout student repository
      - name: Checkout student repository
        uses: actions/checkout@v4

      # Step 2: Start Oracle XE container
      - name: Start Oracle XE container
        run: |
          docker run --name oracle-db -d -p 1521:1521 -p 5500:5500 \
            -e ORACLE_PASSWORD=oracle \
            -v ${{ github.workspace }}:/workspace \
            gvenzl/oracle-xe:21-slim

      # Step 3: Wait for Oracle to be ready
      - name: Wait for Oracle to be ready
        run: |
          echo "Waiting for Oracle XE to be ready..."
          for i in {1..30}; do
            if docker exec oracle-db bash -lc "echo 'SELECT 1 FROM dual;' | sqlplus -s system/oracle" | grep -q 1; then
              echo "✅ Oracle is ready."
              break
            fi
            sleep 5
          done

      # Step 4: Clone private solutions repository
      - name: Clone private solutions repository
        run: |
          git clone https://x-access-token:${{ secrets.SOLUTIONS_TOKEN }}@github.com/IESEBRE/MP0484_SOLUCIONS_SQL_2526.git ./MP0484_SOLUCIONS_SQL_2526

      # Step 5: Initialize database schema (optional)
      - name: Run setup SQL if exists
        run: |
          if [ -f ./setup.sql ]; then
            docker exec oracle-db bash -lc "sqlplus system/oracle @/workspace/sql/setup.sql"
          fi

      # Step 6: Unified test step (solution vs student)
      - name: Run and compare SQL queries (solutions vs student)
        run: |
          echo "🔍 Running and comparing all SQL queries..."

          mkdir -p ./results
          pass_count=0
          fail_count=0

          for sol_file in ./MP0484_SOLUCIONS_SQL_2526/SELECT/BLOC1/*.sql; do
            name=$(basename "$sol_file" .sql)
            stud_file="./sql/${name}.sql"

            if [ ! -f "$stud_file" ]; then
              echo "⚠️ Missing student query for $name"
              ((fail_count++))
              continue
            fi

            echo "▶️ Testing $name.sql"

            # Run both queries in the same Oracle session
            docker exec oracle-db bash -lc <<'EOF'
                sqlplus system/oracle <<'EOF_SQL'
                SET HEADING OFF
                SET FEEDBACK OFF
                SET PAGESIZE 0
                SET VERIFY OFF
                SET ECHO OFF
                ALTER SESSION SET NLS_SORT = 'BINARY';
                ALTER SESSION SET NLS_COMP = 'BINARY';
                SPOOL /tmp/${name}_expected.csv
                @${sol_file}
                SPOOL OFF
                SPOOL /tmp/${name}_student.csv
                @${stud_file}
                SPOOL OFF
                EXIT;
                EOF_SQL
              EOF

            # Copy results back to workspace
            docker cp oracle-db:/tmp/${name}_expected.csv ./results/
            docker cp oracle-db:/tmp/${name}_student.csv ./results/

            # Compare results ignoring row order
            if diff -q <(sort ./results/${name}_expected.csv) <(sort ./results/${name}_student.csv) > /dev/null; then
              echo "✅ $name: Passed"
              ((pass_count++))
            else
              echo "❌ $name: Failed (results differ)"
              ((fail_count++))
            fi

          done

          echo "---------------------------------------------"
          echo "Total passed: $pass_count"
          echo "Total failed: $fail_count"

          if ((fail_count > 0)); then
            exit 1
          fi

      # Step 7: Upload test results as artifact
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sql-test-results
          path: ./results

