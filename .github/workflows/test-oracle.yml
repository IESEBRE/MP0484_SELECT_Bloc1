name: Test Oracle SQL Queries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout student repository
        uses: actions/checkout@v4

      # 👇 Step 1: Start Oracle XE container
      - name: Start Oracle XE container
        run: |
          docker run --name oracle-db -d -p 1521:1521 -p 5500:5500 -e ORACLE_PASSWORD=oracle -v ${{ github.workspace }}:/workspace gvenzl/oracle-xe:21-slim

      # 👇 Step 2: Wait for Oracle to start
      - name: Wait for Oracle to be ready
        run: |
          echo "Waiting for Oracle XE to be ready..."
          for i in {1..30}; do
            if docker exec oracle-db bash -lc "echo 'SELECT 1 FROM dual;' | sqlplus system/oracle" | grep -q 1; then
              echo "✅ Oracle is ready."
              break
            fi
            sleep 5
          done

      # 👇 Step 3: Clone the private solutions repository
      - name: Clone private solutions repository
        run: |
          git clone https://x-access-token:${{ secrets.SOLUTIONS_TOKEN }}@github.com/IESEBRE/MP0484_SOLUCIONS_SQL_2526.git /workspace/solutions
        # Replace YOUR_GITHUB_USERNAME and repo name as needed

      # 👇 Step 4: Initialize database schema
      # (Optional – if you need a schema or data before running queries)
      - name: Run setup SQL (if exists)
        run: |
          if [ -f /workspace/setup.sql ]; then
            docker exec oracle-db bash -lc "sqlplus system/oracle @/workspace/sql/setup.sql"
          fi

      # 👇 Unified Step: Run and compare queries directly
      - name: Run and compare SQL queries (solutions vs student)
        run: |
          echo "🔍 Running and comparing all SQL queries..."

          mkdir -p /workspace/results
          pass_count=0
          fail_count=0

          # Loop through each solution query
          for sol_file in /workspace/solutions/SELECT/BLOC1/*.sql; do
            name=$(basename "$sol_file" .sql)
            stud_file="/workspace/sql/${name}.sql"

            if [ ! -f "$stud_file" ]; then
              echo "⚠️  Missing student query for $name"
              ((fail_count++))
              continue
            fi

            echo "▶️  Testing $name.sql"

            # Run both queries in the SAME Oracle session
           docker exec oracle-db bash -lc "sqlplus system/oracle <<EOF_SQL
SET HEADING OFF
SET FEEDBACK OFF
SET PAGESIZE 0
SET VERIFY OFF
SET ECHO OFF
ALTER SESSION SET NLS_SORT = 'BINARY';
ALTER SESSION SET NLS_COMP = 'BINARY';
SPOOL /tmp/${name}_expected.csv
@$sol_file
SPOOL OFF
SPOOL /tmp/${name}_student.csv
@$stud_file
SPOOL OFF
EXIT;
EOF_SQL
"


            # Copy both result files to workspace
            docker cp oracle-db:/tmp/${name}_expected.csv /workspace/results/
            docker cp oracle-db:/tmp/${name}_student.csv /workspace/results/

            # Compare both results (ignoring line order)
            if diff -q <(sort /workspace/results/${name}_expected.csv) <(sort /workspace/results/${name}_student.csv) > /dev/null; then
              echo "✅ $name: Passed"
              ((pass_count++))
            else
              echo "❌ $name: Failed (results differ)"
              ((fail_count++))
            fi

          done

          echo "---------------------------------------------"
          echo "Total passed: $pass_count"
          echo "Total failed: $fail_count"
          if ((fail_count > 0)); then
            exit 1
          fi

      # 👇 Step 8: Upload test results as artifact
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sql-test-results
          path: /workspace/results
